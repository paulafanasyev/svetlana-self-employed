# CI: lint → tests → web build → security → Android build.
# Web build remains as a validation step; deployment is handled separately.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# CI permissions: source checkout and test/build only.
permissions:
  contents: read


jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Install once, cache for downstream jobs
  # ─────────────────────────────────────────────────────────────────────────
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Lint + unit tests (backend)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Static code checks
        run: npm run lint
      - name: Backend unit tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          DB_PATH: ':memory:'
          STORAGE_DIR: ./tmp-storage
      - name: Web unit tests
        run: npm run test:web
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Build web (production) — проверка, что сайт собирается для мир-самозанятых.рф
  # ─────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build web (root domain)
        run: npm run build:web
        env:
          VITE_BASE_PATH: '/'
          VITE_PUBLIC_ORIGIN: 'https://xn----8sba1acxdkgqms3b9euc.xn--p1ai'

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Lightweight security gate
  # ─────────────────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (API keys / tokens must never be committed)
        run: |
          set -e
          if grep -rEn "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}" \
             --include='*.js' --include='*.jsx' --include='*.json' --include='*.kt' \
             --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' . ; then
            echo "::error::Secret-like string found in source"
            exit 1
          fi
          echo "No committed secrets found"

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Android build (§36) — APK artifact, no upload of secrets
  # ─────────────────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android release APK + AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace -PmirApiBaseUrl="${{ vars.PUBLIC_API_URL || 'https://мир-самозанятых.рф/api/v1' }}"
      - name: Verify release manifest is HTTPS-only
        run: |
          if grep -R -n 'usesCleartextTraffic="true"' android/app/src/main android/app/src/release 2>/dev/null; then
            echo "::error::Release sources must not allow cleartext traffic"
            exit 1
          fi
          echo "Release manifest is HTTPS-only"
      # APK/AAB только для master/ручного запуска, 3 дня; ошибка квоты не валит сборку.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 3
