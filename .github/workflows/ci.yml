# CI: lint → tests → web build → security → Android build.
# Web build remains as a validation step; deployment is handled separately.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# CI permissions: source checkout and test/build only.
permissions:
  contents: read


jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Install once, cache for downstream jobs
  # ─────────────────────────────────────────────────────────────────────────
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Lint + unit tests (backend)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Static code checks
        run: npm run lint
      - name: Backend unit tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          DB_PATH: ':memory:'
          STORAGE_DIR: ./tmp-storage
      - name: Web unit tests
        run: npm run test:web
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Build web (production) — same bundle for Pages and the root domain
  # ─────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build web (GitHub Pages base path)
        run: npm run build:web
        env:
          # Project sites are served from /<repo>/; the canonical root-domain
          # build overrides this with '/' at deploy time. One codebase (§5).
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
          VITE_PUBLIC_ORIGIN: 'https://paulafanasyev.github.io/svetlana-self-employed'
      - name: Add SPA deep-link fallback (404.html)
        # GitHub Pages serves 404.html for unknown paths. We must NOT just copy
        # index.html (that keeps the 404 status and breaks deep links). Instead
        # the 404 page stores the intended URL and redirects to the base path,
        # which returns 200; index.html then restores the original URL client-side.
        run: |
          cat > web/dist/404.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <title>Мир Самозанятых</title>
              <script>
                // Preserve the deep link, then load the app shell from the
                // deployment base path (HTTP 200). index.html restores the URL.
                (function () {
                  try { sessionStorage.redirect = location.href; } catch (e) {}
                  location.replace('@@PAGES_BASE@@');
                })();
              </script>
            </head>
            <body></body>
          </html>
          HTMLEOF
          # Inject the real base path so the redirect targets this deployment.
          # Must be an absolute path ('/<repo>/'): a relative URL would resolve
          # against the current deep link and land in the wrong directory.
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('web/dist/404.html')
          p.write_text(p.read_text().replace("@@PAGES_BASE@@", "/${{ github.event.repository.name }}/"))
          PYEOF
          echo "404.html: deep-link preserve + redirect to base path"
      - name: Add canonical-URL override for GitHub Pages
        run: |
          # GitHub Pages is the currently reachable public origin. Keep it indexable
          # until the canonical custom domain is actually available.
          cat > web/dist/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://paulafanasyev.github.io/svetlana-self-employed/sitemap.xml
          EOF
  # ─────────────────────────────────────────────────────────────────────────
  # 4. Lightweight security gate
  # ─────────────────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (API keys / tokens must never be committed)
        run: |
          set -e
          if grep -rEn "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}" \
             --include='*.js' --include='*.jsx' --include='*.json' --include='*.kt' \
             --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' . ; then
            echo "::error::Secret-like string found in source"
            exit 1
          fi
          echo "No committed secrets found"

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Android build (§36) — APK artifact, no upload of secrets
  # ─────────────────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android release APK + AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace -PmirApiBaseUrl="${{ vars.PUBLIC_API_URL || 'https://мир-самозанятых.рф/api/v1' }}"
      - name: Verify release manifest is HTTPS-only
        run: |
          if grep -R -n 'usesCleartextTraffic="true"' android/app/src/main android/app/src/release 2>/dev/null; then
            echo "::error::Release sources must not allow cleartext traffic"
            exit 1
          fi
          echo "Release manifest is HTTPS-only"
      # APK/AAB только для master/ручного запуска, 3 дня; ошибка квоты не валит сборку.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 3
