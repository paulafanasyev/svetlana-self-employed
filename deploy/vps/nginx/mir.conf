# мир-самозанятых.рф → backend Светланы (он же отдаёт собранный сайт)
# Длинные имена доменов в punycode: увеличиваем таблицу имён (директива уровня http, задаётся один раз).
server_names_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    server_name __MIR_DOMAIN__ www.__MIR_DOMAIN__;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
