# я-зарядка.рф → статический сайт + Пико через единую Светлану
server {
    listen 80;
    listen [::]:80;
    server_name __YZ_DOMAIN__ www.__YZ_DOMAIN__;

    root __YZ_WWW__;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # «Спроси Пико»: тот же адрес, что и на Vercel, отвечает единая Светлана (профиль zaryadka)
    location = /api/pico/chat {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4000/api/v1/assistant/pico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2|onnx|wasm)$ {
        expires 7d;
        try_files $uri =404;
    }
    location = /web-app/sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
